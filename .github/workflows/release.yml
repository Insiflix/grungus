name: Build and release desktop app

on:
  push:
    branches: ['**']
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@v8
        id: version
        with:
          script: |
            const detect = require('./scripts/release-version.cjs');
            await detect({ github, context, core });

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            args: --win --x64 --arm64
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Compile application
        run: npm run build:app
        env:
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
      - name: Package application and update metadata
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete GitHub release
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({ github, context, core });
